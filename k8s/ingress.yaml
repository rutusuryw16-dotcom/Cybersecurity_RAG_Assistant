apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cyber-rag-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cyber-rag-backend-svc
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: cyber-rag-backend-svc
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cyber-rag-frontend-svc
            port:
              number: 80
