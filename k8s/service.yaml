apiVersion: v1
kind: Service
metadata:
  name: cyber-rag-backend-svc
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: cyber-rag-backend
---
apiVersion: v1
kind: Service
metadata:
  name: cyber-rag-frontend-svc
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: cyber-rag-frontend
